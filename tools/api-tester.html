<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketplace</title>
<style>
  /* ===================== 1. Token màu và cỡ chữ (sáng/tối thiết kế riêng) ===================== */
  :root {
    --bg: #f5f6f8; --surface: #ffffff; --surface-2: #f0f2f5;
    --text: #111827; --muted: #4b5563; --line: #d5d9e0;
    --primary: #0f766e; --primary-hover: #0b5f58; --on-primary: #ffffff; --primary-soft: #e0f2f1;
    --price: #b42f0b; --danger: #b42318; --danger-soft: #fdecea; --ok: #067647; --ok-soft: #e3f4ea;
    --warn: #8a4b08; --warn-soft: #fdf1dc;
    --shadow: 0 1px 2px rgba(17, 24, 39, .08), 0 4px 12px rgba(17, 24, 39, .05);
    --radius: 12px; --radius-sm: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116; --surface: #171b22; --surface-2: #1f242d;
      --text: #eef1f6; --muted: #aab3c2; --line: #333b48;
      --primary: #2dd4bf; --primary-hover: #5eead4; --on-primary: #06201d; --primary-soft: #0f2f2c;
      --price: #ff9a6c; --danger: #ff8a80; --danger-soft: #3a1a18; --ok: #5fd39a; --ok-soft: #123222;
      --warn: #f5bf6b; --warn-soft: #36270f;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  h1, h2, h3 { line-height: 1.25; margin: 0 0 8px; }
  h1 { font-size: 24px; } h2 { font-size: 18px; } h3 { font-size: 16px; }
  a { color: var(--primary); }
  img { max-width: 100%; display: block; }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }
  .num { font-variant-numeric: tabular-nums; }          /* chữ số cùng bề rộng để giá/tồn kho không nhảy */
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  :focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; border-radius: 4px; }
  .skip { position: absolute; left: 8px; top: -60px; background: var(--primary); color: var(--on-primary); padding: 8px 12px; border-radius: var(--radius-sm); z-index: 1000; }
  .skip:focus { top: 8px; }
  .ic { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ===================== 2. Nút, ô nhập, nhãn (vùng chạm tối thiểu 44px) ===================== */
  button, .btn { font: inherit; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 8px 16px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--surface); color: var(--text); cursor: pointer; text-decoration: none; touch-action: manipulation; transition: background .15s, border-color .15s, transform .15s; }
  button:hover, .btn:hover { border-color: var(--primary); }
  button:active, .btn:active { transform: scale(.98); }
  .btn-primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); font-weight: 600; }
  .btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
  .btn-danger { color: var(--danger); border-color: var(--danger); }
  .btn-ghost { background: transparent; border-color: transparent; }
  .btn-sm { min-height: 44px; padding: 4px 12px; font-size: 14px; }
  button:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  label { display: block; font-size: 14px; font-weight: 600; margin: 12px 0 4px; }
  input, select, textarea { font: inherit; width: 100%; min-height: 44px; padding: 8px 12px; background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: var(--radius-sm); }
  textarea { min-height: 96px; resize: vertical; }
  input[type="checkbox"], input[type="radio"] { width: 20px; min-height: 20px; height: 20px; accent-color: var(--primary); }
  .hint { font-size: 14px; color: var(--muted); margin-top: 4px; }
  .error-text { font-size: 14px; color: var(--danger); margin-top: 8px; }
  .check { display: flex; align-items: center; gap: 8px; min-height: 44px; margin: 12px 0 4px; font-weight: 500; }
  .check label { margin: 0; font-weight: 500; }

  /* ===================== 3. Khung trang, header, điều hướng ===================== */
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
  header.top { position: sticky; top: 0; z-index: 40; background: var(--surface); border-bottom: 1px solid var(--line); }
  .top-row { display: flex; align-items: center; gap: 16px; padding: 12px 0; flex-wrap: wrap; }
  .brand { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 20px; color: var(--text); text-decoration: none; min-height: 44px; }
  .brand .ic { color: var(--primary); width: 28px; height: 28px; }
  .search { flex: 1 1 280px; display: flex; gap: 8px; min-width: 0; }
  .nav-right { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .menu { position: relative; }
  .menu summary { list-style: none; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 4px 12px; border: 1px solid var(--line); border-radius: var(--radius-sm); cursor: pointer; }
  .menu summary::-webkit-details-marker { display: none; }
  .menu .panel { position: absolute; right: 0; top: calc(100% + 8px); min-width: 220px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 8px; z-index: 50; }
  .menu .panel a, .menu .panel button { display: flex; width: 100%; justify-content: flex-start; border: 0; background: transparent; padding: 8px 12px; min-height: 44px; color: var(--text); text-decoration: none; border-radius: var(--radius-sm); }
  .menu .panel a:hover, .menu .panel button:hover { background: var(--surface-2); }
  .menu .sep { border-top: 1px solid var(--line); margin: 8px 0; }
  .avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--primary); color: var(--on-primary); display: inline-grid; place-items: center; font-weight: 700; font-size: 14px; }
  main { padding: 24px 0 96px; outline: none; }
  footer.foot { border-top: 1px solid var(--line); padding: 16px 0 32px; color: var(--muted); font-size: 14px; }

  /* ===================== 4. Thẻ, lưới sản phẩm, chip ===================== */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .pad { padding: 16px; }
  .hero { background: linear-gradient(135deg, var(--primary), var(--primary-hover)); color: var(--on-primary); border-radius: var(--radius); padding: 24px; margin-bottom: 16px; }
  .hero h1 { margin: 0 0 4px; } .hero p { margin: 0; opacity: .95; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 8px; scrollbar-width: thin; }
  .chip { display: inline-flex; align-items: center; min-height: 44px; padding: 4px 16px; border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 999px; text-decoration: none; white-space: nowrap; }
  .chip[aria-current="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); font-weight: 600; }
  .tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; font-size: 14px; background: var(--surface-2); border: 1px solid var(--line); }
  .tag.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
  .tag.off { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
  .tag.bad { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
  .layout { display: grid; grid-template-columns: 260px 1fr; gap: 24px; align-items: start; }
  .filters { position: sticky; top: 96px; }
  .filters summary { font-weight: 700; cursor: pointer; min-height: 44px; display: flex; align-items: center; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  .pcard { display: flex; flex-direction: column; color: inherit; text-decoration: none; overflow: hidden; transition: transform .2s, border-color .2s; }
  .pcard:hover { transform: translateY(-2px); border-color: var(--primary); }
  .thumb { aspect-ratio: 4 / 3; width: 100%; display: grid; place-items: center; font-size: 40px; font-weight: 700; color: rgba(255,255,255,.95); background: var(--surface-2); overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .pcard .body { padding: 12px; display: grid; gap: 4px; }
  .pname { font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 48px; }
  .price { color: var(--price); font-weight: 700; font-size: 18px; }
  .stars { color: var(--warn); letter-spacing: 1px; }
  .rowflex { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .between { justify-content: space-between; }
  .pager { display: flex; gap: 12px; align-items: center; justify-content: center; margin-top: 24px; flex-wrap: wrap; }
  .empty { text-align: center; padding: 48px 16px; color: var(--muted); }
  .empty .ic { width: 40px; height: 40px; margin-bottom: 8px; }
  .notice { padding: 12px 16px; border-radius: var(--radius-sm); border-left: 4px solid var(--warn); background: var(--warn-soft); color: var(--text); margin-bottom: 16px; }
  .notice.err { border-color: var(--danger); background: var(--danger-soft); }
  .notice.okk { border-color: var(--ok); background: var(--ok-soft); }
  .skel { background: linear-gradient(90deg, var(--surface-2) 25%, var(--line) 37%, var(--surface-2) 63%); background-size: 400% 100%; animation: sh 1.4s ease infinite; border-radius: var(--radius-sm); }
  @keyframes sh { 0% { background-position: 100% 50% } 100% { background-position: 0 50% } }

  /* ===================== 5. Trang chi tiết, shop, form, bảng ===================== */
  .detail { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; }
  .detail .thumb { border-radius: var(--radius); font-size: 96px; }
  .shopbar { display: flex; align-items: center; gap: 16px; padding: 16px; }
  .shopbar .avatar { width: 64px; height: 64px; font-size: 28px; }
  .cart-list { display: grid; gap: 12px; }
  .cart-item { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 16px; }
  .cart-item .thumb { aspect-ratio: 1; border-radius: var(--radius-sm); }
  .cart-item-main { min-width: 0; display: grid; align-content: start; gap: 8px; }
  .cart-item-main h2 { margin: 0; }
  .cart-item-price { color: var(--muted); }
  .cart-summary { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 16px; padding: 16px; }
  .authbox { max-width: 440px; margin: 24px auto; }
  .kv { display: grid; grid-template-columns: 110px 1fr; gap: 8px 12px; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; word-break: break-all; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-size: 14px; color: var(--muted); font-weight: 600; }
  td.actions { white-space: nowrap; }
  .mini { display: flex; gap: 12px; align-items: center; min-width: 0; }
  .mini .thumb { width: 56px; aspect-ratio: 1; font-size: 20px; border-radius: var(--radius-sm); flex: none; }
  .stockbox { display: flex; gap: 8px; align-items: center; }
  .stockbox input { width: 88px; }
  dialog { width: min(560px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); overflow: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--text); padding: 24px; box-shadow: var(--shadow); }
  dialog::backdrop { background: rgba(0, 0, 0, .55); }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
  .toasts { position: fixed; left: 16px; bottom: 16px; display: grid; gap: 8px; z-index: 200; max-width: calc(100vw - 32px); }
  .toast { background: var(--text); color: var(--bg); padding: 12px 16px; border-radius: var(--radius-sm); box-shadow: var(--shadow); max-width: 420px; }
  .toast.err { background: var(--danger); color: #fff; }
  @media (prefers-color-scheme: dark) { .toast.err { color: #1a0a09; } }

  /* ===================== 6. Ngăn gỡ lỗi API (cho nhà phát triển) ===================== */
  .devbtn { position: fixed; right: 16px; bottom: 16px; z-index: 90; box-shadow: var(--shadow); }
  .dev { position: fixed; right: 0; top: 0; bottom: 0; width: min(520px, 100vw); background: var(--surface); border-left: 1px solid var(--line); z-index: 120; overflow: auto; padding: 16px; box-shadow: var(--shadow); }
  .dev pre { margin: 8px 0 0; padding: 12px; background: var(--surface-2); border-radius: var(--radius-sm); overflow: auto; max-height: 280px; font: 13px/1.45 ui-monospace, Consolas, monospace; white-space: pre-wrap; word-break: break-word; }
  .dev details { border-top: 1px solid var(--line); padding: 8px 0; }
  .dev summary { cursor: pointer; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-height: 44px; }
  .st { font-weight: 700; font-size: 12px; padding: 0 8px; border-radius: 6px; color: #fff; background: var(--muted); }
  .st.s2 { background: var(--ok); } .st.s4 { background: var(--warn); } .st.s5, .st.s0 { background: var(--danger); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .dot.ok { background: var(--ok); } .dot.err { background: var(--danger); }

  /* ===================== 7. Responsive: điện thoại trước, thu gọn bảng thành thẻ ===================== */
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    .filters { position: static; }
    .detail { grid-template-columns: 1fr; }
    .cart-item { grid-template-columns: 80px minmax(0, 1fr); gap: 12px; }
    .cart-summary { align-items: stretch; flex-direction: column; }
    .nav-right { margin-left: 0; }
    table, thead, tbody, tr, th, td { display: block; }
    thead { position: absolute; left: -9999px; }
    tr { border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 12px; padding: 8px; background: var(--surface); }
    td { border: 0; padding: 6px 8px; }
    td[data-label]::before { content: attr(data-label) ": "; color: var(--muted); font-size: 14px; }
    td.actions { white-space: normal; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>

<script>
"use strict";

/* =====================================================================
   1. TIỆN ÍCH CHUNG
   ===================================================================== */
const $ = (sel, root = document) => root.querySelector(sel);

/** Lưu cục bộ. Có thể bị chặn (chế độ riêng tư...) nên mọi thao tác đều bọc try/catch. */
const store = {
  get(k) { try { return localStorage.getItem("mpt." + k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem("mpt." + k, v); } catch { /* bỏ qua */ } },
  del(k) { try { localStorage.removeItem("mpt." + k); } catch { /* bỏ qua */ } },
};

/**
 * Dựng phần tử DOM bằng code thay vì innerHTML, để dữ liệu từ server (tên sản phẩm, mô tả...)
 * luôn được coi là CHỮ THƯỜNG chứ không bao giờ bị hiểu là HTML (chống XSS).
 * attrs: class, on<sự kiện>, value (gán sau khi có con), còn lại là thuộc tính HTML; con: chuỗi hoặc phần tử.
 */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  let value;
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === "class") el.className = v;
    else if (k === "value") value = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  if (value !== undefined) el.value = value; // select/input cần gán sau khi các <option> đã có
  return el;
}

/** Thay toàn bộ nội dung của el bằng các nút con, bỏ qua null/false.
 *  (replaceChildren(null) sẽ chèn chữ "null" ra màn hình, nên không dùng trực tiếp khi một phần tử có thể vắng, như phân trang.) */
function put(el, ...kids) { el.replaceChildren(...kids.flat().filter((k) => k != null && k !== false)); }

/** Icon từ bộ SVG ở đầu trang. Chuỗi HTML ở đây là hằng số của mình, không chứa dữ liệu từ server. */
function icon(name) {
  const s = document.createElement("span");
  s.style.display = "inline-flex";
  s.innerHTML = '<svg class="ic" aria-hidden="true"><use href="#i-' + name + '"/></svg>';
  return s.firstChild;
}

/** Tiền từ API là decimal string; không ép Number để tránh làm tròn giá trị lớn. */
function money(v) {
  const match = /^(-?)(\d+)(?:\.(\d+))?$/.exec(String(v ?? "0"));
  if (!match) return String(v ?? "0") + " ₫";
  const [, sign, whole, rawFraction = ""] = match;
  const fraction = rawFraction.replace(/0+$/, "");
  const negative = sign === "-" && (/[1-9]/.test(whole) || fraction !== "");

/** Cộng/trừ các chuỗi tiền thập phân mà không đi qua Number (tránh sai số với VND lớn). */
function sumMoney(values) {
  const parsed = [];
  for (const value of values) {
    const match = /^(-?)(\d+)(?:\.(\d+))?$/.exec(String(value ?? "0"));
    if (!match) return null;
    parsed.push({ negative: match[1] === "-", whole: match[2], fraction: match[3] || "" });
  }
  const scale = parsed.reduce((max, part) => Math.max(max, part.fraction.length), 0);
  let total = 0n;
  for (const part of parsed) {
    const amount = BigInt(part.whole + part.fraction.padEnd(scale, "0"));
    total += part.negative ? -amount : amount;
  }
  const negative = total < 0n;
  const digits = (negative ? -total : total).toString().padStart(scale + 1, "0");
  const whole = scale ? digits.slice(0, -scale) : digits;
  const fraction = scale ? "." + digits.slice(-scale) : "";
  return (negative ? "-" : "") + whole + fraction;
}
/** Nhân chuỗi tiền thập phân với số lượng nguyên, giữ nguyên độ chính xác. */
function mulMoney(value, quantity) {
  const match = /^(-?)(\d+)(?:\.(\d+))?$/.exec(String(value ?? "0"));
  const times = Number(quantity);
  if (!match || !Number.isInteger(times) || times < 0) return null;
  const scale = (match[3] || "").length;
  let amount = BigInt(match[2] + (match[3] || "")) * BigInt(times);
  if (match[1] === "-") amount = -amount;
  const negative = amount < 0n;
  const digits = (negative ? -amount : amount).toString().padStart(scale + 1, "0");
  const whole = scale ? digits.slice(0, -scale) : digits;
  const fraction = scale ? "." + digits.slice(-scale) : "";
  return (negative ? "-" : "") + whole + fraction;
}
/** Dấu của chuỗi tiền: 1 dương, -1 âm, 0 bằng 0. */
function moneySign(value) {
  const match = /^(-?)(\d+)(?:\.(\d+))?$/.exec(String(value ?? "0"));
  if (!match) return 0;
  const digits = BigInt(match[2] + (match[3] || ""));
  if (digits === 0n) return 0;
  return match[1] === "-" ? -1 : 1;
}
/** ISO-8601 -> ngày giờ ngắn gọn; dữ liệu lỗi thì hiện dấu gạch. */
function dateTime(value) {

  const date = new Date(value);

function colorFor(id) {
  let n = 2166136261;                                   // băm FNV-1a: id gần giống nhau vẫn cho màu khác hẳn nhau
  for (const c of String(id)) { n ^= c.charCodeAt(0); n = Math.imul(n, 16777619); }

/**
 * Gọi API. Tự gắn token, ghi log, và nếu gặp 401 thì thử refresh đúng một lần rồi gọi lại.
 * Luôn trả { status, ok, data, networkError } và KHÔNG ném lỗi, để trang tự quyết định hiển thị.
 */
async function api(method, path, opts = {}) {
  const url = state.base.replace(/\/+$/, "") + path;
  const headers = {};
  if (opts.body !== undefined) headers["Content-Type"] = "application/json";
  if (opts.auth !== false && state.access) headers["Authorization"] = "Bearer " + state.access;
  const requestHeaders = maskHeaders(headers);
  const t0 = performance.now();
  let res, text;
  try {
    res = await fetch(url, { method, headers, body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined });
    text = await res.text();
  } catch (e) {
    addLog({ method, url, status: 0, ms: performance.now() - t0, reqHeaders: requestHeaders, req: mask(opts.body), resHeaders: null, res: String(e) });
    return { status: 0, ok: false, data: null, requestHeaders, responseHeaders: null, networkError: true };
  }
  let data = null;
  if (text) { try { data = JSON.parse(text); } catch { data = text; } }
  const responseHeaders = maskHeaders(res.headers);
  addLog({ method, url, status: res.status, ms: performance.now() - t0, reqHeaders: requestHeaders, req: mask(opts.body), resHeaders: responseHeaders, res: mask(data) });
  if (res.status === 401 && opts.retry !== false && state.refresh && !path.startsWith("/auth/")) {
    if (await refreshTokens()) return api(method, path, { ...opts, retry: false });
  }
  return { status: res.status, ok: res.ok, data, requestHeaders, responseHeaders };
}
/** Không giữ thông tin xác thực trong ngăn log request của tester. */
function mask(value) {
  const sensitive = /^(authorization|proxy[-_]?authorization|cookie|set[-_]?cookie|www[-_]?authenticate|password|current[-_]?password|new[-_]?password|refresh[-_]?token|access[-_]?token|x[-_]?(?:auth|access|refresh)[-_]?token|token|code|otp|x[-_]?api[-_]?key|api[-_]?key|secret|payment[-_]?url|vnp[-_]?secure[-_]?hash)$/i;
  if (Array.isArray(value)) return value.map(mask);
  if (typeof value === "string") {
    if (/[?&]vnp_SecureHash=/i.test(value) || /^(?:https?:\/\/|\/)/i.test(value)) return maskUrl(value);
    return value;
  }
  if (!value || typeof value !== "object") return value;
  return Object.fromEntries(Object.entries(value).map(([key, item]) => [key, sensitive.test(key) ? "***" : mask(item)]));
}
/** Headers có thể mang bearer/cookie; lưu và hiển thị bản đã che, không giữ bản thô trong log. */
function maskHeaders(headers) {
  const sensitive = /^(authorization|proxy-authorization|www-authenticate|cookie|set-cookie|.*(?:token|secret|signature|api[-_]?key|secure[-_]?hash|session[-_]?id))$/i;
  const entries = [];
  if (headers && typeof headers.forEach === "function") headers.forEach((value, key) => entries.push([key, value]));
  else if (headers && typeof headers === "object") entries.push(...Object.entries(headers));
  return Object.fromEntries(entries.map(([key, value]) => {
    if (sensitive.test(key)) return [key, "***"];
    if (/^link$/i.test(key) && typeof value === "string") {
      return [key, value.replace(/<([^>]+)>/g, (match, uri) => "<" + maskUrl(uri) + ">")];
    }
    return [key, mask(value)];
  }));
}
/** Che secret trong query/fragment để URL tùy ý không làm lộ token hay reset code trong log. */
function maskUrl(value) {
  const sensitive = /^(authorization|access[-_]?token|refresh[-_]?token|security[-_]?token|x[-_]?(?:auth|access|refresh)[-_]?token|token|password|current[-_]?password|new[-_]?password|reset[-_]?code|code|otp|x[-_]?api[-_]?key|api[-_]?key|secret|signature|sig|credential|awsaccesskeyid|x[-_]?(?:amz|goog)[-_]?(?:signature|credential|security[-_]?token)|session[-_]?id|payment[-_]?url|vnp[-_]?secure[-_]?hash)$/i;
  const redactQuery = (url) => String(url).replace(/([?&](?:authorization|access[-_]?token|refresh[-_]?token|security[-_]?token|x[-_]?(?:auth|access|refresh)[-_]?token|token|password|current[-_]?password|new[-_]?password|reset[-_]?code|code|otp|x[-_]?api[-_]?key|api[-_]?key|secret|signature|sig|credential|awsaccesskeyid|x[-_]?(?:amz|goog)[-_]?(?:signature|credential|security[-_]?token)|session[-_]?id|payment[-_]?url|vnp[-_]?secure[-_]?hash)=)[^&#]*/gi, "$1***").replace(/#.*$/, "");
  if (!/^[a-z][a-z\d+.-]*:\/\//i.test(value) && !String(value).startsWith("//")) return redactQuery(value);
  try {
    const url = new URL(value, location.href);
    url.username = url.username ? "***" : "";
    url.password = url.password ? "***" : "";
    for (const key of url.searchParams.keys()) if (sensitive.test(key)) url.searchParams.set(key, "***");
    url.hash = "";
    return url.toString();
  } catch {
    return String(value).replace(/([?&](?:authorization|access[-_]?token|refresh[-_]?token|x[-_]?(?:auth|access|refresh)[-_]?token|token|password|current[-_]?password|new[-_]?password|reset[-_]?code|code|otp|x[-_]?api[-_]?key|api[-_]?key|secret|payment[-_]?url|vnp[-_]?secure[-_]?hash)=)[^&#]*/gi, "$1***").replace(/#.*$/, "");
  }
}

/** Câu lỗi dễ hiểu cho người dùng, kèm cách khắc phục (không chỉ nói "lỗi"). */
function errMsg(r) {
  if (r.networkError) return "Không kết nối được tới server. Hãy kiểm tra backend đã chạy chưa và địa chỉ API trong ngăn «API» (nếu mở file này trực tiếp, đặt APP_CORS_ALLOWED_ORIGIN_PATTERNS=* trong .env rồi khởi động lại backend).";
  const e = r.data && r.data.error;
  if (!e) return "Có lỗi xảy ra (HTTP " + r.status + ").";
  const f = e.fieldErrors ? " " + Object.entries(e.fieldErrors).map(([k, v]) => k + ": " + v).join("; ") : "";
  return e.message + f;
}

async function refreshTokens() {

/** Hộp xác nhận cho thao tác nguy hiểm. Trả về Promise<boolean>. */
function confirmDialog(title, text, okLabel) {
  return new Promise((resolve) => {
    const m = $("#modal");
    let done = false;
    const finish = (v) => { if (!done) { done = true; resolve(v); } m.close(); };
    openModal(title, h("div", {},
      h("p", {}, text),

        h("button", { onclick: () => finish(false) }, "Huỷ"),
        h("button", { class: "btn-danger", onclick: () => finish(true) }, okLabel))));
    m.addEventListener("close", () => { if (!done) { done = true; resolve(false); } }, { once: true });
  });
}

   4. ĐỊNH TUYẾN (theo phần #hash để mọi trang đều có đường dẫn riêng, chia sẻ được)
   ===================================================================== */
let routeId = 0;
function parseHash() {
  const raw = location.hash.slice(1) || "/";
  const [path, query] = raw.split("?");
  return { parts: path.split("/").filter(Boolean), query: new URLSearchParams(query || "") };
}
function navigate(path, params) {
  const q = params ? qs(params) : "";
  const target = "#" + path + (q ? "?" + q : "");
  if (location.hash === target) route(); else location.hash = target;
}

async function route() {
  const id = ++routeId;
  const { parts, query } = parseHash();
  // ctx.mount chỉ vẽ khi đây vẫn là lần điều hướng mới nhất (tránh trang cũ ghi đè trang mới khi bấm nhanh).
  const ctx = { id, mount(node, focus = true) {
    if (id !== routeId) return false;
    $("#view").replaceChildren(node);
    if (focus) { const hd = $("#view h1"); (hd || $("#view")).setAttribute("tabindex", "-1"); (hd || $("#view")).focus({ preventScroll: true }); }
    return true;
  } };
  document.querySelectorAll("details.menu").forEach((d) => (d.open = false));
  const [a, b] = parts;
  try {
    if (!a) await viewHome(ctx, query);
    else if (a === "product" && b) await viewProduct(ctx, b);
    else if (a === "shop" && b) await viewShop(ctx, b, query);
    else if (a === "cart") await viewCart(ctx);
    else if (a === "orders" && b) await viewOrder(ctx, b);
    else if (a === "orders") await viewOrders(ctx, query);
    else if (a === "login") viewLogin(ctx, query);
    else if (a === "register") viewRegister(ctx);
    else if (a === "forgot-password") viewForgotPassword(ctx);
    else if (a === "account") await viewAccount(ctx);
    else if (a === "seller" && b === "orders") await viewSellerOrders(ctx, query);
    else if (a === "seller" && b === "shipments") await viewSellerShipments(ctx, query);
    else if (a === "seller") await viewSeller(ctx);
    else if (a === "admin") await viewAdmin(ctx, query);
    else ctx.mount(emptyState("Không tìm thấy trang", "Đường dẫn này không tồn tại.", h("a", { class: "btn btn-primary", href: "#/" }, "Về trang chủ")));
  } catch (e) {
    ctx.mount(h("div", { class: "notice err", role: "alert" }, "Lỗi hiển thị trang: " + e.message));
  }
  if (id === routeId) window.scrollTo(0, 0);
}

/* ---------- Giỏ hàng của customer ---------- */
async function viewCart(ctx) {
  if (!state.user) return navigate("/login", { next: "/cart" });
  if (state.user.role !== "CUSTOMER") {
    return ctx.mount(emptyState("Giỏ hàng dành cho khách hàng", "Tài khoản seller/admin không thể dùng API giỏ hàng.", h("a", { class: "btn", href: "#/" }, "Về trang chủ")));
  }

  let selected = new Set();
  let selectionReady = false;
  let savedAddress = "";
  const box = h("div", {}, skeletonGrid(2));
  ctx.mount(h("div", {}, h("div", { class: "rowflex between" },
    h("h1", { style: "margin:0" }, "Giỏ hàng"), h("a", { class: "btn", href: "#/orders" }, icon("box"), "Đơn hàng")), box));

  async function load() {
    box.replaceChildren(skeletonGrid(2));
    selected = new Set(); selectionReady = false; savedAddress = "";
    const r = await api("GET", "/cart");
    if (ctx.id !== routeId) return;
    if (r.status === 401) { clearSession(); return navigate("/login", { next: "/cart" }); }
    if (!r.ok) return box.replaceChildren(errorBox(r, load));
    // Tuần tự sau giỏ để không gửi hai request cùng lúc nếu access token vừa hết hạn (refresh token xoay vòng).
    const profile = await api("GET", "/users/me");
    if (ctx.id !== routeId) return;
    if (profile.status === 401) { clearSession(); return navigate("/login", { next: "/cart" }); }
    if (profile.ok) savedAddress = profile.data.data.address || "";
    renderCart(r.data.data);
  }

  function requireLogin(result) {
    if (result.status !== 401) return false;
    clearSession(); navigate("/login", { next: "/cart" });
    return true;
  }

  function renderCart(cart) {
    const items = Array.isArray(cart.items) ? cart.items : [];
    if (!items.length) {
      return box.replaceChildren(emptyState("Giỏ hàng trống", "Hãy chọn sản phẩm bạn muốn mua.", h("a", { class: "btn btn-primary", href: "#/" }, "Khám phá sản phẩm")));
    }

    const purchasableItems = items.filter((item) => item.active && item.quantity <= item.availableStock);
    if (!selectionReady) {
      purchasableItems.forEach((item) => selected.add(item.id));
      selectionReady = true;
    } else {
      // Bỏ chọn dòng đã bị xoá hoặc không còn mua được (sản phẩm ẩn/hết tồn kho).
      const purchasableIds = new Set(purchasableItems.map((item) => item.id));
      for (const id of [...selected]) if (!purchasableIds.has(id)) selected.delete(id);
    }

    const quantityInputs = new Map();
    const rows = items.map((item) => {
      const purchasable = item.active && item.quantity <= item.availableStock;
      const status = !item.active ? "Sản phẩm đã ngừng bán" : item.quantity > item.availableStock
        ? "Chỉ còn " + item.availableStock + " sản phẩm trong kho"
        : "Có thể mua";
      const check = h("input", { type: "checkbox", checked: selected.has(item.id), disabled: !purchasable, "aria-label": "Chọn mua " + item.name, onchange: () => {
        if (check.checked) selected.add(item.id); else selected.delete(item.id);
        updateSummary();
      } });
      const quantity = h("input", {
        type: "number", min: "1", max: String(Math.max(1, item.availableStock)), step: "1",
        value: String(item.quantity), disabled: !item.active || item.availableStock < 1,
        "aria-label": "Số lượng " + item.name,
      });
      quantityInputs.set(item.id, quantity);
      const update = h("button", { class: "btn-sm", disabled: !item.active || item.availableStock < 1, onclick: async () => {
        const next = Number(quantity.value);
        if (!Number.isInteger(next) || next < 1 || next > item.availableStock) {
          return toast("Số lượng phải từ 1 đến " + item.availableStock + ".", true);
        }
        update.disabled = true;
        const result = await api("PATCH", "/cart/items/" + encodeURIComponent(item.id), { body: { quantity: next } });
        if (requireLogin(result)) return;
        if (!result.ok) { update.disabled = false; return toast(errMsg(result), true); }
        renderCart(result.data.data);
      } }, "Cập nhật");
      const remove = h("button", { class: "btn-sm btn-danger", onclick: async () => {
        remove.disabled = true;
        const result = await api("DELETE", "/cart/items/" + encodeURIComponent(item.id));
        if (requireLogin(result)) return;
        if (!result.ok) { remove.disabled = false; return toast(errMsg(result), true); }
        renderCart(result.data.data);
      } }, icon("trash"), "Xoá");
      return h("article", { class: "card pad cart-item" }, thumb({ id: item.id, name: item.name, imageUrl: item.imageUrl }),
        h("div", { class: "cart-item-main" },
          h("div", { class: "rowflex between" },
            h("label", { class: "check", style: "margin:0" }, check, "Chọn mua"),
            h("span", { class: "tag " + (purchasable ? "ok" : "bad") }, status)),
          h("h2", {}, item.name),
          h("div", { class: "cart-item-price" }, money(item.unitPrice), " × ", item.quantity, " = ", money(item.lineTotal)),
          h("div", { class: "rowflex" }, h("div", { style: "width:120px" }, quantity), update, remove)));
    });

    const summary = h("section", { class: "card cart-summary" });
    // Vùng status giữ nguyên qua các lần cập nhật để trình đọc màn hình đọc được thay đổi.
    const summaryInfo = h("div");
    const summaryStatus = h("div", { role: "status" });
    const summaryActions = h("div", { class: "rowflex" });
    put(summaryInfo, summaryStatus,
      h("div", { class: "hint" }, "Tổng tạm tính theo giá hiện tại; backend kiểm tra lại giá, tồn kho và tính tổng khi đặt hàng."));
    put(summary, summaryInfo, summaryActions);
    function updateSummary() {
      const chosen = items.filter((item) => selected.has(item.id));
      const total = chosen.length ? (sumMoney(chosen.map((item) => item.lineTotal)) || "0.00") : "0.00";
      put(summaryStatus,
        h("strong", {}, "Đã chọn " + chosen.length + "/" + items.length + " sản phẩm"),
        h("div", { class: "price", style: "margin-top:4px" }, money(total)));
      put(summaryActions,
        h("a", { class: "btn", href: "#/" }, "Tiếp tục mua sắm"),
        h("button", { class: "btn-primary", disabled: !chosen.length, onclick: () => {
          // Số lượng gõ tay chỉ có hiệu lực sau khi bấm Cập nhật; chặn checkout bằng số cũ để tránh đặt nhầm.
          const dirty = chosen.find((item) => {
            const input = quantityInputs.get(item.id);
            return input && Number(input.value) !== item.quantity;
          });
          if (dirty) return toast("Hãy bấm «Cập nhật» cho \"" + dirty.name + "\" trước khi thanh toán.", true);
          checkoutModal(chosen, savedAddress);
        } }, icon("cart"), "Thanh toán"));
    }
    put(box, h("div", { class: "cart-list" }, rows), summary);
    updateSummary();
  }

  load();
}

/** POST /orders: mua các dòng đã chọn; VNPAY trả link đã ký để mở nguyên trạng. */

/** POST /payments/vnpay/create: tạo attempt/link mới cho order VNPAY còn PENDING. */
function vnpayRetryButton(order) {
  const retry = h("button", { class: "btn-primary", onclick: async () => {
    retry.disabled = true;
    const r = await api("POST", "/payments/vnpay/create", { body: { orderId: order.id } });
    retry.disabled = false;
    if (r.status === 401) { clearSession(); return navigate("/login", { next: "/orders/" + order.id }); }
    if (!r.ok) return toast(errMsg(r), true);
    const attempt = r.data.data;
    route(); // GET lại order để đồng bộ paymentStatus sau khi attempt mới được tạo.
    paymentLinkModal(order.id, attempt.paymentUrl);
  } }, "Tạo link thanh toán mới");
  return retry;
}

/** PATCH /orders/{id}/received: customer xác nhận order DELIVERED; request không có body. */
async function confirmOrderReceived(orderId) {
  if (!(await confirmDialog("Xác nhận đã nhận hàng?", "Thao tác này chuyển đơn từ Đã giao sang Hoàn tất. COD đã được ghi nhận khi giao; xác nhận không thu thêm tiền.", "Xác nhận nhận hàng"))) return;
  const result = await api("PATCH", "/orders/" + encodeURIComponent(orderId) + "/received");
  if (result.status === 401) { clearSession(); return navigate("/login", { next: "/orders/" + orderId }); }
  if (!result.ok) return toast(errMsg(result), true);
  toast("Đã xác nhận nhận hàng. Đơn hàng hoàn tất.");
  route();
}

/** Tải đủ các dòng của đúng seller/order; chỉ tạo nếu mọi dòng chưa huỷ đã được xác nhận. */
async function sellerCreateShipmentModal(reload) {
  const err = h("div", { class: "error-text", role: "alert" });
  const orderSelect = h("select", { required: true, "aria-label": "Chọn đơn có mặt hàng đã xác nhận" },
    h("option", { value: "" }, "— Chọn đơn hàng —"));
  const method = h("select", { value: "PLATFORM_DELIVERY" },
    h("option", { value: "PLATFORM_DELIVERY" }, "Giao qua đơn vị vận chuyển"),
    h("option", { value: "SELF_DELIVERY" }, "Shop tự giao"));
  const carrier = h("select", {}, h("option", { value: "" }, "— Chọn đơn vị vận chuyển —"));
  const carrierField = field("Đơn vị vận chuyển", carrier);
  const loadButton = h("button", { type: "button", disabled: true }, "Kiểm tra đơn và dòng hàng");
  const preview = h("div", { class: "small muted" }, "Đang tải đơn có mặt hàng đã xác nhận...");
  const submit = h("button", { class: "btn-primary", type: "submit", disabled: true }, "Tạo shipment");
  let loadedOrderId = "";
  let loadedItems = [];
  let close = () => {};
  const syncMethod = () => { carrierField.hidden = method.value === "SELF_DELIVERY"; };
  const syncSubmit = () => {
    submit.disabled = !loadedOrderId || !loadedItems.length || (method.value === "PLATFORM_DELIVERY" && !carrier.value);
  };
  method.addEventListener("change", syncMethod);
  orderSelect.addEventListener("change", () => {
    loadedOrderId = ""; loadedItems = []; syncSubmit();
    loadButton.disabled = !orderSelect.value;
    preview.textContent = orderSelect.value ? "Kiểm tra các dòng hàng trước khi tạo shipment." : "Chọn đơn cần giao.";
  });
  close = openModal("Tạo shipment", h("form", { onsubmit: async (e) => {
    e.preventDefault(); err.textContent = "";
    if (loadedOrderId !== orderSelect.value || !loadedItems.length) { err.textContent = "Hãy kiểm tra đơn và các dòng hàng trước."; return; }
    if (method.value === "PLATFORM_DELIVERY" && !carrier.value) { err.textContent = "Hãy chọn đơn vị vận chuyển."; return; }
    submit.disabled = true;
    const body = {
      orderId: loadedOrderId,
      deliveryMethod: method.value,
      orderItemIds: loadedItems.filter((item) => item.status === "CONFIRMED").map((item) => item.id),
    };
    if (method.value === "PLATFORM_DELIVERY") body.carrierId = carrier.value;
    const result = await api("POST", "/seller/shipments", { body });

        h("td", { "data-label": "Hiệu lực" }, h("span", { class: "tag " + status[1] }, status[0]), h("div", { class: "small muted" }, dateTime(voucher.validFrom), " → ", dateTime(voucher.validTo))),
        h("td", { "data-label": "Lượt dùng" }, voucher.timesUsed + " / " + voucher.usageLimit),
        h("td", { class: "actions", "data-label": "Thao tác" }, h("div", { class: "rowflex" },

            const expired = await api("DELETE", "/admin/vouchers/" + encodeURIComponent(voucher.code));
            if (expired.status === 401) { clearSession(); return navigate("/login", { next: "/admin?tab=vouchers" }); }
            toast(expired.ok ? "Đã hết hạn voucher." : errMsg(expired), !expired.ok);
            if (expired.ok) load();

      h("thead", {}, h("tr", {}, ["Voucher", "Giảm", "Trạng thái", "Lượt dùng", "Thao tác"].map((label) => h("th", { scope: "col" }, label)))),

function localDateTimeInput(value) {
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return "";
  date.setMinutes(date.getMinutes() - date.getTimezoneOffset());
  return date.toISOString().slice(0, 16);
}
function dateTimeInputToIso(value) {
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? "" : date.toISOString();
}
function voucherModal(voucher, reload) {
  const err = h("div", { class: "error-text", role: "alert" });
  const code = h("input", { required: true, maxlength: "64", pattern: "[A-Za-z0-9_-]{1,64}", value: voucher ? voucher.code : "", disabled: Boolean(voucher) });
  const description = h("textarea", { maxlength: "1000", value: voucher ? voucher.description || "" : "" });
  const percent = h("input", { type: "number", required: true, min: "1", max: "100", step: "1", value: voucher ? String(voucher.discountPercent) : "10" });
  const fromDefault = new Date();
  const toDefault = new Date(fromDefault.getTime() + 30 * 24 * 60 * 60 * 1000);
  const validFrom = h("input", { type: "datetime-local", required: true, value: voucher ? localDateTimeInput(voucher.validFrom) : localDateTimeInput(fromDefault) });
  const validTo = h("input", { type: "datetime-local", required: true, value: voucher ? localDateTimeInput(voucher.validTo) : localDateTimeInput(toDefault) });
  const usageLimit = h("input", { type: "number", required: true, min: String(voucher ? voucher.timesUsed : 1), step: "1", value: voucher ? String(voucher.usageLimit) : "100" });
  const submit = h("button", { class: "btn-primary", type: "submit" }, voucher ? "Lưu voucher" : "Tạo voucher");
  let close = () => {};
  close = openModal(voucher ? "Cập nhật voucher" : "Tạo voucher", h("form", { onsubmit: async (e) => {
    e.preventDefault(); err.textContent = ""; submit.disabled = true;
    const body = {
      description: description.value.trim(),
      discountPercent: Number(percent.value),
      validFrom: dateTimeInputToIso(validFrom.value),
      validTo: dateTimeInputToIso(validTo.value),
      usageLimit: Number(usageLimit.value),
    };
    if (!body.validFrom || !body.validTo || body.validFrom >= body.validTo) {
      submit.disabled = false; err.textContent = "Thời điểm bắt đầu phải trước thời điểm kết thúc."; return;
    }
    if (!voucher) body.code = code.value.trim();
    const result = voucher
      ? await api("PATCH", "/admin/vouchers/" + encodeURIComponent(voucher.code), { body })
      : await api("POST", "/admin/vouchers", { body });
    submit.disabled = false;
    if (result.status === 401) { close(); clearSession(); return navigate("/login", { next: "/admin?tab=vouchers" }); }
    if (!result.ok) { err.textContent = errMsg(result); return; }
    close(); toast(voucher ? "Đã cập nhật voucher." : "Đã tạo voucher."); reload();
  } },
    voucher ? null : field("Mã voucher", code, "Chỉ chữ, số, dấu gạch ngang hoặc gạch dưới; tối đa 64 ký tự. Backend chuẩn hoá thành chữ hoa."),
    field("Mô tả", description), field("Phần trăm giảm", percent),
    h("div", { class: "rowflex" }, h("div", { style: "flex:1" }, field("Bắt đầu", validFrom)), h("div", { style: "flex:1" }, field("Kết thúc", validTo))),
    field("Giới hạn lượt dùng", usageLimit, voucher ? "Không được thấp hơn số lượt đã dùng (" + voucher.timesUsed + ")." : "Tối thiểu 1 lượt."),
    err, h("div", { class: "modal-actions" }, h("button", { type: "button", onclick: () => close() }, "Huỷ"), submit)));
}

/* ---------- Quản trị: người dùng và duyệt seller ---------- */
const ROLE_LABEL = { CUSTOMER: "Khách hàng", SELLER: "Người bán", ADMIN: "Quản trị viên" };
const SELLER_LABEL = { PENDING: ["Chờ duyệt", "off"], APPROVED: ["Đã duyệt", "ok"], REJECTED: ["Bị từ chối", "bad"], SUSPENDED: ["Tạm khoá", "bad"] };

function usersPanel(ctx, host) {
  const f = { role: "", search: "", page: 0 };
  const box = h("div", {});
  const roleSel = h("select", { "aria-label": "Lọc theo vai trò" }, h("option", { value: "" }, "Tất cả vai trò"),
    Object.entries(ROLE_LABEL).map(([v, t]) => h("option", { value: v }, t)));
  const searchIn = h("input", { type: "search", placeholder: "Tìm theo tên hoặc email", "aria-label": "Tìm theo tên hoặc email" });
  const filter = h("form", { class: "rowflex", style: "margin:16px 0", onsubmit: (e) => {
    e.preventDefault(); f.role = roleSel.value; f.search = searchIn.value.trim(); f.page = 0; load();
  } }, h("div", { style: "flex:1 1 220px" }, searchIn), h("div", {}, roleSel), h("button", { type: "submit" }, "Lọc"),
    h("button", { type: "button", class: "btn-primary", onclick: () => createUserModal(load) }, icon("plus"), "Tạo tài khoản"));
  host.replaceChildren(filter, box);

  async function load() {
    box.replaceChildren(skeletonGrid(3));
    const r = await api("GET", "/admin/users?" + qs({ role: f.role, search: f.search, page: f.page, size: 10 }));
    if (ctx.id !== routeId) return;
    if (!r.ok) return box.replaceChildren(errorBox(r, load));
    const d = r.data.data;
    if (!d.content.length) return box.replaceChildren(emptyState("Không có người dùng", "Thử đổi bộ lọc hoặc từ khoá.", null));
    put(box, countLine(d, "người dùng"), h("div", { class: "card" }, h("table", {},
      h("thead", {}, h("tr", {}, ["Người dùng", "Vai trò", "Duyệt người bán", "Tài khoản", "Thao tác"].map((t) => h("th", { scope: "col" }, t)))),
      h("tbody", {}, d.content.map((u) => userRow(u, load))))), pager(d, (pg) => { f.page = pg; load(); }));
  }
  load();
}

/** Một dòng người dùng: nút duyệt/tạm khoá cho seller, khoá/mở khoá cho mọi tài khoản (trừ chính mình). */
function userRow(u, reload) {
  const isMe = state.user && u.id === state.user.id;
  const run = async (label, call) => {
    const r = await call();
    toast(r.ok ? label : errMsg(r), !r.ok);
    if (r.ok) reload();
  };
  const [sellerText, sellerCls] = u.sellerStatus ? SELLER_LABEL[u.sellerStatus] : [null, null];
  const actions = [];
  if (u.role === "SELLER") {
    if (u.sellerStatus !== "APPROVED") actions.push(h("button", { class: "btn-sm btn-primary", onclick: () => run("Đã duyệt người bán.", () => api("PATCH", "/admin/sellers/" + u.id + "/approve")) }, icon("check"), u.sellerStatus === "PENDING" ? "Duyệt" : "Duyệt lại"));
    if (u.sellerStatus === "APPROVED") actions.push(h("button", { class: "btn-sm", onclick: () => run("Đã tạm khoá người bán.", () => api("PATCH", "/admin/sellers/" + u.id + "/suspend")) }, "Tạm khoá"));
    if (u.sellerStatus === "PENDING") actions.push(h("button", { class: "btn-sm", onclick: () => run("Đã từ chối người bán.", () => api("PATCH", "/admin/users/" + u.id, { body: { sellerStatus: "REJECTED" } })) }, "Từ chối"));
  }
  if (!isMe) {
    actions.push(u.enabled
      ? h("button", { class: "btn-sm btn-danger", onclick: async () => {
          if (!(await confirmDialog("Khoá tài khoản?", "«" + (u.name || u.email) + "» sẽ không đăng nhập hay làm mới phiên được nữa. Có thể mở khoá lại.", "Khoá"))) return;
          run("Đã khoá tài khoản.", () => api("DELETE", "/admin/users/" + u.id));
        } }, "Khoá")
      : h("button", { class: "btn-sm", onclick: () => run("Đã mở khoá tài khoản.", () => api("PATCH", "/admin/users/" + u.id, { body: { enabled: true } })) }, "Mở khoá"));
  }
  return h("tr", {},
    h("td", { "data-label": "Người dùng" }, h("strong", {}, u.name || "—"), h("div", { class: "small muted" }, u.email),
      u.phone || u.address ? h("div", { class: "small muted" }, [u.phone, u.address].filter(Boolean).join(" · ")) : null),
    h("td", { "data-label": "Vai trò" }, h("span", { class: "tag" }, ROLE_LABEL[u.role] || u.role)),
    h("td", { "data-label": "Duyệt người bán" }, sellerText ? h("span", { class: "tag " + sellerCls }, sellerText) : "—"),
    h("td", { "data-label": "Tài khoản" }, u.enabled ? h("span", { class: "tag ok" }, "Hoạt động") : h("span", { class: "tag bad" }, "Đã khoá")),
    h("td", { class: "actions", "data-label": "Thao tác" }, h("div", { class: "rowflex" }, actions)));
}

/** Form admin tạo tài khoản mới với vai trò bất kỳ (seller mới luôn ở trạng thái chờ duyệt). */
function createUserModal(reload) {
  const err = h("div", { class: "error-text", role: "alert" });
  const email = h("input", { type: "email", required: true, maxlength: "255", autocomplete: "off" });
  const password = h("input", { type: "password", required: true, minlength: "8", maxlength: "72", autocomplete: "new-password" });
  const name = h("input", { required: true, maxlength: "255" });
  const role = h("select", { required: true }, Object.entries(ROLE_LABEL).map(([v, t]) => h("option", { value: v }, t)));
  const phone = h("input", { type: "tel", maxlength: "15", placeholder: "0912345678" });
  const address = h("textarea", { maxlength: "500", placeholder: "Số nhà, đường, thành phố" });

  let close = () => {};
  close = openModal("Tạo tài khoản", h("form", { onsubmit: async (e) => {
    e.preventDefault(); err.textContent = ""; submit.disabled = true;
    const body = { email: email.value.trim(), password: password.value, name: name.value.trim(), role: role.value };
    if (phone.value.trim()) body.phone = phone.value.trim();
    if (address.value.trim()) body.address = address.value.trim();
    const r = await api("POST", "/admin/users", { body });

    close(); toast("Đã tạo tài khoản."); reload();
  } }, field("Email", email), field("Mật khẩu", password, "Từ 8 đến 72 ký tự."), field("Họ tên", name), field("Vai trò", role, "Người bán mới cần được duyệt trước khi đăng bán."),
    field("Số điện thoại", phone, "Tuỳ chọn. Số di động Việt Nam, ví dụ 0912345678."), field("Địa chỉ", address, "Tuỳ chọn, tối đa 500 ký tự."), err,
    h("div", { class: "modal-actions" }, h("button", { type: "button", onclick: () => close() }, "Huỷ"), submit)));
}

function renameModal(c, reload) {

    e.preventDefault(); err.textContent = "";

/* ---- Ngăn gỡ lỗi: địa chỉ API, lịch sử request, gọi tuỳ ý ---- */
function addLog(e) {
  state.logs.unshift({ ...e, url: maskUrl(e.url), time: new Date().toLocaleTimeString("vi-VN") });
  state.logs.length = Math.min(state.logs.length, 40);
  if (!$("#dev").hidden) renderDevHistory();
}
const pretty = (v) => typeof v === "string" ? v : JSON.stringify(v, null, 2);

/** Chỉ thay vùng lịch sử để request đang chạy không làm mất input/output của công cụ tuỳ ý. */
function renderDevHistory() {
  const history = $("#devHistory");
  if (!history) return;
  put(history, state.logs.length ? state.logs.map((l) => h("details", {},
    h("summary", {}, h("span", { class: "st s" + String(l.status)[0] }, l.status || "ERR"), h("strong", {}, l.method),
      h("span", { class: "small" }, l.url.replace(state.base.replace(/\/+$/, ""), "")), h("span", { class: "small muted" }, l.time + " · " + Math.round(l.ms) + " ms")),
    l.reqHeaders !== undefined ? h("pre", {}, "Headers gửi đi:\n" + pretty(l.reqHeaders)) : null,
    l.req !== undefined ? h("pre", {}, "Body gửi đi:\n" + pretty(l.req)) : null,
    l.resHeaders != null ? h("pre", {}, "Headers nhận về:\n" + pretty(l.resHeaders)) : null,
    h("pre", {}, "Response body:\n" + pretty(l.res))))
    : h("p", { class: "muted small" }, "Chưa có request nào."));
}

async function pingApi(dot, msg) {
  dot.className = "dot"; msg.textContent = "Đang kiểm tra...";
  const r = await api("GET", "/categories", { auth: false });
  dot.className = "dot " + (r.ok ? "ok" : "err");
  msg.textContent = r.ok ? "Kết nối OK" : errMsg(r);
}
function renderDev() {
  const dev = $("#dev");
  const dot = h("span", { class: "dot", role: "img", "aria-label": "Trạng thái kết nối" });
  const msg = h("span", { class: "small muted", role: "status" });
  const base = h("input", { value: state.base, spellcheck: "false", "aria-label": "Địa chỉ API", onchange: (e) => { state.base = e.target.value.trim(); store.set("base", state.base); $("#footBase").textContent = state.base; } });
  const cMethod = h("select", { "aria-label": "Method" }, ["GET", "POST", "PATCH", "PUT", "DELETE"].map((m) => h("option", {}, m)));
  const cPath = h("input", { value: "/products?size=3", spellcheck: "false", "aria-label": "Đường dẫn" });
  const cBody = h("textarea", { placeholder: '{"name":"..."}', spellcheck: "false", "aria-label": "Body JSON" });
  const cOut = h("pre", { hidden: true });
  const send = async () => {
    cOut.hidden = false; let body;
    if (cBody.value.trim()) { try { body = JSON.parse(cBody.value); } catch (e) { cOut.textContent = "Body không phải JSON hợp lệ: " + e.message; return; } }
    const r = await api(cMethod.value, cPath.value.startsWith("/") ? cPath.value : "/" + cPath.value, { body });
    cOut.textContent = "Request headers:\n" + pretty(r.requestHeaders || {}) + "\n\n" + (r.networkError
      ? errMsg(r)
      : "HTTP " + r.status + "\n\nResponse headers:\n" + pretty(r.responseHeaders || {}) + "\n\nResponse body:\n" + pretty(mask(r.data)));
  };
  // put() trải phẳng mảng: danh sách log là một mảng nên không thể truyền thẳng vào replaceChildren.
  put(dev,
    h("div", { class: "rowflex between" }, h("h2", { style: "margin:0" }, "Công cụ gỡ lỗi API"), h("button", { class: "btn-ghost", "aria-label": "Đóng", onclick: toggleDev }, icon("x"))),
    h("label", { for: "devBase" }, "Địa chỉ API"), (base.id = "devBase", base),
    h("div", { class: "rowflex", style: "margin-top:8px" }, h("button", { class: "btn-sm", onclick: () => pingApi(dot, msg) }, "Kiểm tra kết nối"), dot, msg),
    h("h3", { style: "margin-top:16px" }, "Gọi API tuỳ ý"), h("p", { class: "hint" }, "Dùng token của tài khoản đang đăng nhập."),
    h("div", { class: "rowflex" }, h("div", { style: "flex:0 0 110px" }, cMethod), h("div", { style: "flex:1" }, cPath), h("button", { class: "btn-primary", onclick: send }, "Gửi")),
    h("div", { style: "margin-top:8px" }, cBody), cOut,
    h("div", { class: "rowflex between", style: "margin-top:16px" }, h("h3", { style: "margin:0" }, "Lịch sử request"),
      h("button", { class: "btn-sm", onclick: () => { state.logs = []; renderDevHistory(); } }, "Xoá")),
    h("div", { id: "devHistory" }));
  renderDevHistory();
}
function toggleDev() {
  const dev = $("#dev"), btn = $("#devToggle");
  dev.hidden = !dev.hidden;
  btn.setAttribute("aria-expanded", String(!dev.hidden));
  if (!dev.hidden) renderDev();
}
$("#devToggle").addEventListener("click", toggleDev);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#dev").hidden && !$("#modal").open) toggleDev(); });

/* =====================================================================
   7. KHỞI ĐỘNG

$("#footBase").textContent = state.base;
renderNav();
window.addEventListener("hashchange", route);
route();
