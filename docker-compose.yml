# Chạy toàn bộ ở local: PostgreSQL 16 (pgvector) + backend API, KHÔNG đụng tới Supabase.
#   docker compose up -d --build   -> dựng image backend và chạy cả 2 service
#   docker compose logs -f backend -> xem log API (Flyway migrate, lỗi khởi động...)
#   docker compose down            -> dừng, GIỮ dữ liệu DB
#   docker compose down -v         -> dừng và XOÁ dữ liệu DB (lần sau migrate lại từ đầu)
#
# DB local dùng tài khoản cố định bên dưới, không lấy DB_* trong .env (DB_* trong .env là của Supabase,
# dùng khi chạy `mvn spring-boot:run` trên máy). Các biến còn lại (JWT, VNPAY, mail, admin, CORS) lấy từ
# .env; thiếu .env vẫn chạy được với giá trị mặc định.
name: marketplace

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: marketplace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
    ports:
      # Chỉ mở trên loopback: công cụ DB trên máy (DBeaver, psql) nối được, máy khác thì không.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: marketplace-backend:local
    container_name: marketplace-backend
    restart: unless-stopped
    depends_on:
      postgres:
        # Chờ DB nhận kết nối rồi mới start API để Flyway migrate không bị race.
        condition: service_healthy
    # Nạp mọi biến trong .env vào container (VNPAY, mail, admin, CORS...). required: false để thiếu .env
    # vẫn chạy được.
    env_file:
      - path: .env
        required: false
    # environment đè lên env_file: luôn nối Postgres local của compose (host = tên service "postgres"),
    # dù DB_URL trong .env đang trỏ tới Supabase.
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/marketplace
      DB_USERNAME: marketplace
      DB_PASSWORD: marketplace
      # Giá trị trong .env được ưu tiên; không có thì dùng secret chỉ dành cho local.
      APP_JWT_SECRET: ${APP_JWT_SECRET:-dev-only-secret-key-change-me-please-32chars!}
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pgdata:
