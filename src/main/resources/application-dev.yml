spring:
  datasource:
    # Mặc định trỏ tới Postgres chạy local; Docker Compose override bằng DB_URL
    # (trong container host phải là tên service "postgres", không phải localhost).
    url: ${DB_URL:jdbc:postgresql://localhost:5432/marketplace}
    username: ${DB_USERNAME:marketplace}
    password: ${DB_PASSWORD:marketplace}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true

app:
  jwt:
    # Dev fallback để chạy local không cần env. Prod KHÔNG dùng default này:
    # application-prod.yml phải yêu cầu APP_JWT_SECRET (fail-fast khi thiếu).
    secret: ${APP_JWT_SECRET:dev-only-secret-key-change-me-please-32chars!}
    access-expiration-ms: 900000
    refresh-expiration-ms: 604800000
