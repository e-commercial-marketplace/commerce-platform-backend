spring:
  application:
    name: marketplace
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,flyway
  endpoint:
    health:
      show-details: when-authorized

# Không lộ chi tiết lỗi framework ra API: mọi lỗi nghiệp vụ đi qua GlobalExceptionHandler
# với message an toàn; các lỗi còn lại (404, type-mismatch...) dùng message mặc định của Spring.
server:
  error:
    include-message: never
    include-binding-errors: never
