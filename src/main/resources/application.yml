# Cấu hình runtime duy nhất của backend (không còn application-dev.yml).
# Các giá trị phụ thuộc môi trường (DB, JWT secret) đọc từ biến môi trường; khi chạy local
# Spring nạp thêm file .env ở thư mục chạy lệnh — xem .env.example để tạo file đó.
spring:
  application:
    name: marketplace
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: ${JPA_SHOW_SQL:false}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  # Trợ lý AI qua API tương thích OpenAI. Đổi provider chỉ cần đổi 3 biến AI_*, không đổi code.
  # Starter bắt buộc có api-key lúc khởi động: thiếu thì dùng giá trị giả "not-configured"; AiServiceImpl
  # thấy AI_API_KEY rỗng thì không bao giờ gọi provider (trả lời bằng luật thay thế).
  ai:
    # Mặc định 10 lần, có thể giữ request nhiều phút khi provider quá tải (5xx); thử 2 lần rồi chuyển bước sau.
    retry:
      max-attempts: 2
    openai:
      base-url: ${AI_BASE_URL:https://api.openai.com}
      api-key: ${AI_API_KEY:not-configured}
      chat:
        options:
          model: ${AI_MODEL:gpt-4o-mini}
          # Thấp để model bám kết quả tool, ít "sáng tác".
          temperature: 0.3
      # Embedding cho RAG điều khoản: mặc định Google Gemini qua endpoint tương thích OpenAI (provider riêng
      # vì DeepSeek/Groq không có API embedding). Thiếu key thì dùng giá trị giả; PolicyKnowledge thấy
      # AI_EMBEDDING_API_KEY rỗng thì tắt RAG.
      embedding:
        base-url: ${AI_EMBEDDING_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
        # Gemini không có "/v1" trong đường dẫn: URL đủ là <base-url>/embeddings.
        embeddings-path: ${AI_EMBEDDING_PATH:/embeddings}
        api-key: ${AI_EMBEDDING_API_KEY:not-configured}
        options:
          # Phải ra vector 3072 chiều, đúng cột embedding của bảng policy_chunks (V18).
          model: ${AI_EMBEDDING_MODEL:gemini-embedding-001}
    # Dùng chat và embedding; không dựng các model ảnh, âm thanh, kiểm duyệt của starter.
    model:
      embedding: openai
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
  # Redis chỉ làm cache đọc (giỏ hàng, danh mục, trang shop), bật bằng app.cache.enabled. Không có Redis
  # app vẫn chạy (đọc PostgreSQL), nên timeout ngắn để một Redis chết không làm request chậm theo.
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      connect-timeout: 500ms
      timeout: 500ms
      # Chỉ dùng StringRedisTemplate; không quét repository Redis để khỏi lẫn với repository JPA.
      repositories:
        enabled: false

---
# Chỉ nạp .env khi KHÔNG chạy test: test phải cố định theo src/test/resources/application-test.yml
# (H2, Flyway off), không phụ thuộc file .env trên máy từng người.
# optional: thiếu .env vẫn chạy, miễn là biến môi trường đã được export hoặc Compose truyền vào.
spring:
  config:
    activate:
      on-profile: "!test"
    import: optional:file:./.env[.properties]

---
# Prefix version dùng chung cho mọi REST controller (áp dụng tập trung ở WebConfig).
# Controller khai báo route KHÔNG kèm prefix, ví dụ @RequestMapping("/products"); URL bên ngoài
# là /api/v1/products. Actuator và Swagger giữ đường dẫn riêng, không bị prefix.
api:
  prefix: /api/v1

app:
  jwt:
    # Bắt buộc: không có default để thiếu secret thì fail-fast lúc khởi động.
    secret: ${APP_JWT_SECRET}
    access-expiration-ms: ${APP_JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${APP_JWT_REFRESH_EXPIRATION_MS:604800000}
  cors:
    # Tuỳ chọn: origin pattern được gọi API từ trình duyệt, phân cách bằng dấu phẩy (rỗng = không cho).
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:}
  admin:
    # Tuỳ chọn: tạo admin đầu tiên khi DB chưa có admin nào (bỏ trống thì không tạo).
    email: ${APP_ADMIN_EMAIL:}
    password: ${APP_ADMIN_PASSWORD:}
  mail:
    # false (mặc định): không gửi email, chỉ ghi mã ra log. CHỈ dùng khi phát triển local.
    enabled: ${APP_MAIL_ENABLED:false}
    # Địa chỉ người gửi, phải đã được xác minh trên Brevo.
    from: ${APP_MAIL_FROM:}
    # Gửi qua API HTTPS của Brevo vì Render miễn phí chặn cổng SMTP.
    brevo-api-key: ${BREVO_API_KEY:}
  password-reset:
    # Quy tắc mã đặt lại mật khẩu theo features/auth/API_CONTRACT.md (Password management).
    code-ttl-minutes: 15
    max-attempts: 5
    resend-cooldown-seconds: 60
    max-codes-per-hour: 5
  ai:
    # Có AI_API_KEY thì dùng LLM; rỗng thì /ai/ask luôn trả lời bằng luật, không gọi provider.
    api-key: ${AI_API_KEY:}
    # false: không trả lời bằng luật; LLM không dùng được thì trả 429 hoặc 503 AI_UNAVAILABLE.
    rules-enabled: ${APP_AI_RULES_ENABLED:true}
    # Provider dự phòng, mặc định Gemini qua endpoint tương thích OpenAI. Key rỗng thì không dựng ChatClient này.
    fallback:
      api-key: ${AI_FALLBACK_API_KEY:}
      base-url: ${AI_FALLBACK_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
      completions-path: ${AI_FALLBACK_COMPLETIONS_PATH:/chat/completions}
      model: ${AI_FALLBACK_MODEL:gemini-2.5-flash}
    # Có AI_EMBEDDING_API_KEY thì bật RAG điều khoản (cần PostgreSQL có pgvector); rỗng thì tắt.
    embedding-api-key: ${AI_EMBEDDING_API_KEY:}
  cloudinary:
    # Upload ảnh trực tiếp lên Cloudinary (features/upload/API_CONTRACT.md). Trống thì tắt: API ký trả 503, không
    # kiểm tra URL ảnh. API secret chỉ nằm ở backend, tuyệt đối không đưa vào biến của app di động.
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  cache:
    # false (mặc định): không dùng Redis, mọi dữ liệu đọc thẳng PostgreSQL. Bật khi đã có REDIS_URL.
    # Một cờ cho cả cache giỏ hàng và cache danh mục/trang shop (architecture §5.4).
    enabled: ${APP_CACHE_ENABLED:false}
  vnpay:
    # Lấy từ email VNPAY gửi khi đăng ký merchant sandbox (sandbox.vnpayment.vn/devreg). Không commit giá trị thật.
    tmn-code: ${APP_VNPAY_TMN_CODE:}
    hash-secret: ${APP_VNPAY_HASH_SECRET:}
    pay-url: ${APP_VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    # Trình duyệt quay về đây sau trang VNPAY; khi deploy đổi thành domain Render.
    return-url: ${APP_VNPAY_RETURN_URL:http://localhost:8080/api/v1/payments/vnpay/return}
    # Backend xử lý xong Return URL thì chuyển trình duyệt về địa chỉ này (deep link của app).
    app-redirect-url: ${APP_VNPAY_APP_REDIRECT_URL:marketplace://payment-result}
    expire-minutes: 15

management:
  endpoints:
    web:
      exposure:
        include: health,info,flyway
  endpoint:
    health:
      show-details: when-authorized
  health:
    # Redis chỉ là cache tuỳ chọn: mất Redis không được làm /actuator/health trả 503 (Render coi deploy hỏng).
    redis:
      enabled: false

# Không lộ chi tiết lỗi framework ra API: mọi lỗi nghiệp vụ đi qua GlobalExceptionHandler
# với message an toàn; các lỗi còn lại (404, type-mismatch...) dùng message mặc định của Spring.
server:
  error:
    include-message: never
    include-binding-errors: never
